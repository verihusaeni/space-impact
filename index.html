<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STARFALL: VOID FRONTIER</title>
<style>
html,body{margin:0;height:100%;background:#05010f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;display:block;touch-action:none}
.b{position:absolute;display:none;border:2px solid #4df;background:#4df3;color:#bff;font:700 13px system-ui,sans-serif;z-index:5}

</style></head><body>
<canvas id="c"></canvas><button class="b" id="bb">BOMB</button><button class="b" id="rkb">ROKET</button><button class="b" id="lzb">MEGA</button><button class="b" id="pb">II</button><div id="rot">&#8635;<br><br>Putar perangkat ke mode landscape<br>untuk bermain</div>
<script>
// ===== CONFIG =====
let W=1280,OX=0,hs=1;const H=720,R=Math.random,PI=Math.PI,TAU=PI*2;
const CFG={SPEED:460,STAGES:8,WAVES:5,DROP:.12,DEBUG:false,PCAP:[150,300,500]};
const NAMES=['DEEP SPACE','ASTEROID FIELD','ALIEN ZONE','SPACE STATION','NEBULA SECTOR','DARK VOID','BLACK HOLE','FINAL ZONE'];
const BOSSES=[{n:'DESTROYER',a:['spread','aim']},{n:'HIVE QUEEN',a:['circle','summon']},{n:'FORTRESS',a:['aim','rain']},{n:'PHANTOM',a:['tp','spread']},
{n:'METEOR LORD',a:['rain','circle']},{n:'CYBER CORE',a:['aim','circle','rain']},{n:'VOID HUNTER',a:['homing','tp']},{n:'FINAL ENTITY',a:['spread','circle','homing','summon','rain']}];
// hp, speed, score, radius, hue, shootCooldown
const D=[[3,150,100,18,0,3.5],[3,140,120,18,30,0],[2,330,100,14,50,0],[14,70,300,32,200,2.5],[5,110,200,22,280,1.6],[3,200,150,16,330,0],
[4,100,250,20,170,2.2],[6,110,250,24,120,0],[5,120,250,22,210,3],[5,120,200,20,260,2.2],[1,200,60,12,90,0],[25,100,800,30,10,1.2],[4,170,200,20,15,2.4],[2,320,150,16,55,0],[5,150,220,20,190,1.7]];
const PUC=['#fa0','#3f6','#4af','#c5f','#ff4','#fff','#f33','#6fe','#f80','#fd6','#8ff'],PUL=['W','+','S','B','R','$','L','2','F','M','Z'],PW=[10,9,7,4,6,6,7,6,7,4,3];
function pickPU(){let r=R()*69;for(let i=0;i<11;i++)if((r-=PW[i])<0)return i;return 0}
// ===== DIFFICULTY =====
const DN=['EASY','NORMAL','HARD','IMPOSSIBLE'],DC=['#4f8','#4df','#fa3','#f33'],
DS=['Musuh lemah, damage kecil, bomb & drop melimpah','Pengalaman standar','Musuh kuat & agresif, serangan dari segala arah lebih sering','Musuh brutal, damage 2.5x, drop langka. Semoga berhasil!'],
DFT=[{hp:.7,sp:.85,fr:.7,pj:.85,dm:.6,dr:1.8,sc:.5,bm:4,bh:.7,fl:.5,fp:.35},{hp:1,sp:1,fr:1,pj:1,dm:1,dr:1,sc:1,bm:2,bh:1,fl:1,fp:.55},
{hp:1.35,sp:1.12,fr:1.4,pj:1.15,dm:1.4,dr:.8,sc:1.5,bm:1,bh:1.25,fl:1.4,fp:.75},{hp:2,sp:1.3,fr:2,pj:1.3,dm:2.5,dr:.55,sc:3,bm:1,bh:1.8,fl:2,fp:1}],DF=()=>DFT[SV.diff];
// ===== CANVAS / RESIZE =====
const cv=document.getElementById('c'),cx=cv.getContext('2d'),bb=document.getElementById('bb'),pbn=document.getElementById('pb'),rkb=document.getElementById('rkb'),lzb=document.getElementById('lzb'),rot=document.getElementById('rot');
let S=1;
function rs(){const d=Math.min(devicePixelRatio||1,2),iw=innerWidth,ih=innerHeight;W=cl(Math.round(iw/ih*H),1180,1700);OX=(W-1280)/2;S=Math.min(iw/W,ih/H);hs=cl(.8/S,1,1.6);
cv.style.width=W*S+'px';cv.style.height=H*S+'px';cv.style.left=(iw-W*S)/2+'px';cv.style.top=(ih-H*S)/2+'px';cv.width=W*S*d;cv.height=H*S*d;cx.setTransform(S*d,0,0,S*d,0,0);
const por=ih>iw;rot.style.display=por?'flex':'none';if(por&&(st=='PLAY'||st=='COUNT'))ss('PAUSE');for(const q of stars)if(q.x>W)q.x=R()*W}
addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,250));document.addEventListener('fullscreenchange',()=>setTimeout(rs,100));
// ===== STORAGE =====
let SV={hi:0,stage:1,q:2,shake:1,snd:1,auto:0,diff:1};
function loadGame(){try{Object.assign(SV,JSON.parse(localStorage.getItem('sfvf')||'{}'))}catch(e){}}
function saveGame(){try{localStorage.setItem('sfvf',JSON.stringify(SV))}catch(e){}}
// ===== AUDIO =====
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')try{AC.resume()}catch(e){}}
function snd(f,d,ty,v,sl){if(!AC||!SV.snd)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'square';
o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),t+d);g.gain.setValueAtTime(v||.04,t);
g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sShoot=()=>snd(700,.08,'square',.02,.4),sBoom=()=>snd(160,.35,'sawtooth',.07,.2),sPow=()=>{snd(500,.1,'triangle',.06,2);snd(900,.15,'triangle',.05,1.5)},
sHit=()=>snd(300,.05,'square',.03,.6),sWarn=()=>{snd(220,.5,'sawtooth',.08,1.4);setTimeout(()=>snd(220,.5,'sawtooth',.08,1.4),600)},sClick=()=>snd(600,.05,'triangle',.05);
// ===== STATE =====
let st='MENU',stage=1,wave=0,wt=0,Q=[],E=[],B=[],PU=[],PA=[],TX=[],boss=null,p,shk=0,flash=0,ts=1,banner=null,bw=0,clr=0,btns=[],ups=[],rapid=0,
mx=640,my=360,mouseMode=false,down=false,touchOK=false,beat=0,fps=60,fpsT=0,fpsN=0,tm=0;
const keys={};
let cd3=0,cdN=9;function cnt(){ss('COUNT');cd3=3.5;cdN=9}
function ss(s){st=s;const v=((s=='PLAY'||s=='COUNT')&&touchOK)?'block':'none';bb.style.display=pbn.style.display=rkb.style.display=lzb.style.display=v}
function newGame(s){p={x:150,y:360,hp:100,mh:100,sh:50,ms:50,wl:1,sc:0,cb:0,cbt:0,inv:0,cd:0,bomb:DF().bm,rk:DF().bm>2?2:1,ml:1,lzT:0,flT:0,twT:0,mlT:0,wx:150,wy:420,dm:1,fr:1,sp:1,shT:0,nd:true};stage=s;startStage();cnt()}
function startStage(){wave=0;Q=[];E=[];B=[];PU=[];boss=null;bw=0;wt=2.5;banner={t:2.5,a:'STAGE '+stage,b:NAMES[stage-1]+' — HOSTILE FLEET DETECTED'};ss('PLAY');p.x=150;p.y=360}
function dif(){const d=DF();return{hp:(1+(stage-1)*.18+wave*.04)*d.hp,sp:(1+(stage-1)*.04)*d.sp,fr:(1+(stage-1)*.05)*d.fr,pj:(1+(stage-1)*.03)*d.pj}}
// ===== UTIL =====
const cl=(v,a,b)=>v<a?a:v>b?b:v;
function burst(x,y,n,c,sp,s){n=Math.ceil(n*[.4,.7,1][SV.q]);for(let i=0;i<n&&PA.length<CFG.PCAP[SV.q];i++){const a=R()*TAU,v=R()*sp;PA.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+R()*.5,m:1,s:s*(.5+R()),c})}}
function boom(x,y,sz){burst(x,y,sz*6,'#fa4',sz*9,3+sz*.3);burst(x,y,sz*3,'#fff',sz*6,2);shk=Math.max(shk,sz*1.2);sBoom()}
function txt(x,y,s,c){TX.push({x,y,s,c:c||'#fff',l:1})}
// ===== INPUT =====
function fs(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{});else document.exitFullscreen()}catch(e){}}
addEventListener('keydown',e=>{ac();keys[e.code]=1;if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault();
if(e.code=='Escape'||e.code=='KeyP'){if(st=='PLAY'||st=='COUNT')ss('PAUSE');else if(st=='PAUSE')cnt()}
if(e.code=='KeyX')bomb();if(e.code=='KeyC')rocket();if(e.code=='KeyV')mega();if(e.code=='KeyF')fs();
if(st=='UPGRADE'&&/^Digit[123]$/.test(e.code)&&ups[+e.code[5]-1])pickUp(ups[+e.code[5]-1])});
addEventListener('keyup',e=>keys[e.code]=0);
let lx=0,ly=0;
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/S,(e.clientY-r.top)/S]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const[x,y]=pos(e);mx=x;my=y;lx=e.clientX;ly=e.clientY;down=true;
if(e.pointerType=='touch'){touchOK=true;mouseMode=false}
for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){sClick();b.fn();down=false;break}}});
cv.addEventListener('pointermove',e=>{e.preventDefault();const[x,y]=pos(e);mx=x;my=y;
if(e.pointerType=='touch'){if(down&&st=='PLAY'&&p){p.x+=(e.clientX-lx)/S*1.3;p.y+=(e.clientY-ly)/S*1.3}lx=e.clientX;ly=e.clientY}else if(st=='PLAY')mouseMode=true});
addEventListener('pointerup',()=>down=false);
bb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();bomb()});
pbn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ss('PAUSE')});
rkb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();rocket()});lzb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();mega()});
addEventListener('contextmenu',e=>e.preventDefault());
// ===== ENEMIES =====
function mk(ty,x,y){const d=D[ty],f=dif();const hp=d[0]*f.hp,sp=d[1]*f.sp;const e={x,y,y0:y,ty,hp,mh:hp,sp,sc:d[2],r:d[3],hue:d[4],cd:d[5]?R()*d[5]+1:0,ph:R()*TAU,t:0,sh:ty==8?6*f.hp:0,tp:2,hit:0,vx:0,vy:0};
if(ty==13){const a=Math.atan2(p.y-y,p.x-x);e.vx=Math.cos(a)*sp;e.vy=Math.sin(a)*sp}return e}
function add(ty,x,y,t){Q.push({t:t||0,ty,x,y})}
function spawnWave(){const k=wave,av=Math.min(11,2+stage+k),pick=()=>R()*av|0;wt=1.5;if(k<WAVES_()&&k>=(SV.diff>1?1:2)&&R()<DF().fp)flank();
const simple=[0,1,2,10],fk=['v','wall','snake','diag','swarm','rush'];
if(k==WAVES_()){add(11,W+80,360,0);add(11,W+80,200,.5);add(11,W+80,520,.5);for(let i=0;i<4;i++)add(pick()%3,W+60,100+i*160,1+i*.3);banner={t:2,a:'ELITE SQUADRON',b:''};return}
const n=1+(k>2&&R()<.6?1:0);
for(let g=0;g<n;g++){const f=fk[R()*fk.length|0],base=g*3;let ty=pick();
if(f=='swarm')for(let i=0;i<14;i++)add(10,W+60,80+R()*560,base+i*.15);
else if(f=='rush')for(let i=0;i<6;i++)add(2,W+60,80+R()*560,base+i*.25);
else{if(ty>2&&ty!=5)ty=ty;const heavy=[3,4,6,7,8,9,11].includes(ty),c=heavy?3:5;
for(let i=0;i<c;i++){let x=W+60,y=360,t=base;
if(f=='v'){x+=Math.abs(i-(c-1)/2)*60;y=360+(i-(c-1)/2)*80}
else if(f=='wall'){y=120+i*(480/(c-1||1))}
else if(f=='snake'){y=360;t+=i*.4;ty=heavy?1:ty}
else{x+=i*50;y=100+i*(520/c)}
add(heavy&&ty==11?4:ty,x,y,t)}}}}
const WAVES_=()=>CFG.WAVES;
// serangan dari belakang (kiri), atas & bawah
function flank(){const k=Math.min(7,Math.round((2+stage*.4)*DF().fl)),t0=1+R()*1.5,f=R()*5|0;
for(let i=0;i<k;i++){const tt=t0+i*.35;
if(f==0)add(12,-60,110+R()*520,tt);
else if(f==1)add(13,120+R()*(W-300),-40,tt);
else if(f==2)add(13,120+R()*(W-300),H+40,tt);
else if(f==3)add(14,200+R()*(W-500),i%2?-40:H+40,tt+i*.3);
else{add(12,-60,110+R()*520,tt);add(13,300+R()*500,i%2?-40:H+40,tt)}}
banner={t:2,a:'! SERANGAN DARI SEGALA ARAH !',b:f==0?'DARI BELAKANG':f==1?'DARI ATAS':f==2?'DARI BAWAH':f==3?'PENEMBAK ATAS & BAWAH':'SERANGAN GABUNGAN'}}
function eFire(e){if(e.ty>=12?(e.x<20||e.x>W-20||e.y<60||e.y>H-10):(e.x>W-40||e.x<p.x+60))return;const f=dif(),a=Math.atan2(p.y-e.y,p.x-e.x);
if(e.ty==6)ebul(e.x,e.y,a,560*f.pj,4,'#f44');
else if(e.ty==11){for(let i=-1;i<=1;i++)ebul(e.x,e.y,a+i*.25,300*f.pj,5,'#f84')}
else ebul(e.x,e.y,e.ty==0?PI:a,270*f.pj,5,'#f66')}
function ebul(x,y,a,s,r,c,hm){if(B.length<500)B.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,d:10,r,o:1,c,hm:hm||0,l:7})}
function updEnemy(e,dt){e.t+=dt;e.hit-=dt;const ty=e.ty;
if(ty==1||ty==10){e.x-=e.sp*dt;e.y=e.y0+Math.sin(e.t*3+e.ph)*(ty==1?120:60)}
else if(ty==4){if(e.x>850)e.x-=e.sp*dt;else e.y=cl(e.y+Math.sin(e.t*2+e.ph)*80*dt,70,690)}
else if(ty==5){e.x-=e.sp*.6*dt;const dy=p.y-e.y;e.y+=Math.sign(dy)*Math.min(Math.abs(dy),e.sp*.8*dt)}
else if(ty==6){if(e.x>900)e.x-=e.sp*dt;e.y+=(p.y-e.y)*dt*.8}
else if(ty==9){e.x-=e.sp*.5*dt;e.tp-=dt;if(e.tp<=0){e.tp=2+R()*1.5;burst(e.x,e.y,15,'#c8f',120,3);e.x=400+R()*700;e.y=90+R()*560;e.y0=e.y;burst(e.x,e.y,15,'#c8f',120,3)}}
else if(ty==11){if(e.x>900)e.x-=e.sp*dt;e.y=cl(e.y0+Math.sin(e.t)*140,80,680)}
else if(ty==12){e.x+=e.sp*dt;e.y+=(p.y-e.y)*dt*.6}else if(ty==13){e.x+=e.vx*dt;e.y+=e.vy*dt}else if(ty==14){const out=e.t>9,g=out?(e.y0<0?-120:H+120):(e.y0<0?115:H-40);e.y+=cl(g-e.y,-150*dt,150*dt);if(!out)e.x+=cl(p.x-e.x,-90*dt,90*dt)}else e.x-=e.sp*dt;
if(e.cd>0){e.cd-=dt;if(e.cd<=0){eFire(e);e.cd=D[ty][5]/dif().fr+.2}}}
function killE(e){boom(e.x,e.y,e.r>24?6:3);const m=1+Math.floor(p.cb/5)*.5,s=Math.round(e.sc*m*DF().sc);p.sc+=s;txt(e.x,e.y,'+'+s);p.cb++;p.cbt=3;
if(p.cb%5==0)txt(p.x,p.y-40,'COMBO x'+(1+Math.floor(p.cb/5)*.5),'#fd4');
if(e.ty==7)for(let i=-1;i<=1;i++){const n=mk(2,e.x,e.y+i*30);n.hp=n.mh=1;n.sp=180;n.r=11;n.y0=n.y;E.push(n)}
if(R()<(e.ty==11?1:CFG.DROP*DF().dr))PU.push({x:cl(e.x,40,W-40),y:cl(e.y,90,H-40),ty:e.ty==11?0:pickPU(),t:0})}
// ===== PLAYER =====
let sx0=0,sy0=0;function pb(a,dm,r,c,hm,off){B.push({x:sx0+30,y:sy0+(off||0),vx:Math.cos(a)*900,vy:Math.sin(a)*900,d:dm*p.dm,r,o:0,c,hm:hm||0,l:1.5})}
function shoot(){const w=p.wl;sShoot();
if(w==1)pb(0,1,4,'#6df');
else if(w==2){pb(0,1,4,'#6df',0,-9);pb(0,1,4,'#6df',0,9)}
else if(w==3){pb(0,1,4,'#6df');pb(-.13,1,4,'#6df');pb(.13,1,4,'#6df')}
else if(w==4){for(let i=-2;i<=2;i++)pb(i*.13,1,4,'#8ef')}
else if(w==5){pb(0,4,10,'#f4f');pb(-.2,1,4,'#8ef');pb(.2,1,4,'#8ef')}
else if(w==6){pb(0,4,10,'#f4f');pb(-.15,3,8,'#f4f');pb(.15,3,8,'#f4f')}
else{pb(0,4,10,'#f4f');pb(-.15,3,8,'#f4f');pb(.15,3,8,'#f4f');pb(-.3,1,4,'#8ef');pb(.3,1,4,'#8ef');
pb(-.6,2,5,'#fa4',1,-10);pb(.6,2,5,'#fa4',1,10);if(w>=8){pb(-1.2,2,5,'#fa4',1,-10);pb(1.2,2,5,'#fa4',1,10)}}}
function hurt(d){if(p.inv>0||st!='PLAY')return;d*=DF().dm;p.inv=1;p.cb=0;p.nd=false;p.shT=3;flash=.25;shk=Math.max(shk,10);
if(p.sh>0){p.sh-=d;burst(p.x,p.y,15,'#4af',200,3);snd(500,.1,'sine',.06);if(p.sh<0){p.hp+=p.sh;p.sh=0}}else{p.hp-=d;sHit();burst(p.x,p.y,15,'#f64',200,3)}
if(p.hp<=0){p.hp=0;boom(p.x,p.y,10);SV.hi=Math.max(SV.hi,p.sc);saveGame();snd(200,1,'sawtooth',.08,.2);ss('OVER')}}
function bomb(){if(st!='PLAY'||p.bomb<=0)return;p.bomb--;flash=.6;shk=30;snd(80,.8,'sawtooth',.1,.3);
for(const e of E){e.hp-=12;e.hit=.1}if(boss)boss.hp-=boss.mh*.05;B=B.filter(b=>!b.o);burst(640,360,80,'#fff',800,4);txt(p.x,p.y-40,'BOMB!','#f8f')}
const ML=3.2,srcs=()=>p.twT>0?[[p.x,p.y],[p.wx,p.wy]]:[[p.x,p.y]],mlW=()=>150*Math.max(0,Math.min(1,(ML-p.mlT)/.35,p.mlT/.35));
function area(f,d,db){for(const e of E)if(f(e.x,e.y,e.r)){if(e.sh>0)e.sh-=d;else e.hp-=d;e.hit=.06}
if(boss&&boss.dying<=0&&boss.x<W-20&&f(boss.x,boss.y,boss.r)){boss.hp-=db;boss.hit=.05}}
function flame(x,y,dt){const L=270;for(let i=0;i<5;i++)if(PA.length<CFG.PCAP[SV.q]+160){const a=(R()-.5)*.6,v=420+R()*300;PA.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.35+R()*.15,m:.5,s:5+R()*8,c:R()<.5?'#f60':'#fc3'})}
const f=(ex,ey,r)=>{const dx=ex-x;return dx>-r&&dx<L+r&&Math.abs(ey-y)<dx*.36+r+8};area(f,55*dt*p.dm,55*dt*p.dm);B=B.filter(b=>!(b.o&&f(b.x,b.y,b.r)))}
function rocket(){if(st!='PLAY'||p.rk<=0)return;p.rk--;flash=.25;snd(300,.6,'sawtooth',.07,2.5);const L=E.filter(e=>e.x>0&&e.x<W&&e.y>0&&e.y<H);if(boss&&boss.dying<=0)L.push(boss,boss,boss);

for(const q of PA){cx.globalAlpha=cl(q.l/q.m,0,1);cx.fillStyle=q.c;cx.fillRect(q.x,q.y,q.s,q.s)}cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
cx.font='700 16px system-ui';cx.textAlign='center';for(const t of TX){cx.globalAlpha=cl(t.l,0,1);cx.fillStyle=t.c;cx.fillText(t.s,t.x,t.y)}cx.globalAlpha=1}

if(shk>0&&SV.shake)cx.translate((R()-.5)*shk,(R()-.5)*shk);
drawBG(st=='PLAY'||st=='CLEAR'?dt:dt*.5,st=='MENU');
if(st=='MENU'){const d=SV.diff,qn=['LOW','MEDIUM','HIGH'];ctr('STARFALL',100,88,'#8ef');ctr('V O I D   F R O N T I E R',165,28,'#f8c');

btn('GRAPHICS: '+qn[SV.q],440,373,195,48,()=>{SV.q=(SV.q+1)%3;saveGame()});btn('SHAKE: '+(SV.shake?'ON':'OFF'),645,373,195,48,()=>{SV.shake^=1;saveGame()});

btn('FULLSCREEN',440,485,195,48,fs);btn('RESET SAVE',645,485,195,48,()=>{if(confirm('Hapus semua progres?')){SV={hi:0,stage:1,q:2,shake:1,snd:1,auto:0,diff:1};saveGame()}});
ctr(DS[d],562,17,DC[d]);ctr('HIGH SCORE  '+SV.hi,600,22,'#fd4');

else{drawWorld();if(p)drawHUD();

btn('PLAY AGAIN',490,430,300,50,()=>newGame(1));btn('MAIN MENU',490,494,300,50,()=>ss('MENU'))}}

let last=performance.now();
function loop(n){requestAnimationFrame(loop);let dt=Math.min(.05,(n-last)/1000);last=n;fpsN++;fpsT+=dt;if(fpsT>.5){fps=fpsN/fpsT;fpsN=0;fpsT=0}
